name: diagnose-keystore
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check keystore secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "b64 length: ${#KEYSTORE_B64}"
          echo "b64 first 10: ${KEYSTORE_B64:0:10}"
          echo "b64 last 10: ${KEYSTORE_B64: -10}"
          echo "b64 at 500: ${KEYSTORE_B64:500:10}"
          echo "b64 at 1000: ${KEYSTORE_B64:1000:10}"
          echo "b64 at 1500: ${KEYSTORE_B64:1500:10}"
          echo "b64 at 2000: ${KEYSTORE_B64:2000:10}"
          echo "b64 at 2500: ${KEYSTORE_B64:2500:10}"
          echo "b64 at 3000: ${KEYSTORE_B64:3000:10}"
          echo "b64 at 600: ${KEYSTORE_B64:600:10}"
          echo "b64 at 700: ${KEYSTORE_B64:700:10}"
          echo "b64 at 800: ${KEYSTORE_B64:800:10}"
          echo "b64 at 900: ${KEYSTORE_B64:900:10}"
          echo "b64 at 3100: ${KEYSTORE_B64:3100:10}"
          echo "b64 at 3200: ${KEYSTORE_B64:3200:10}"
          echo "b64 at 3300: ${KEYSTORE_B64:3300:10}"
          echo "b64 at 3400: ${KEYSTORE_B64:3400:10}"
          echo "b64 at 3500: ${KEYSTORE_B64:3500:10}"
          echo "password length: ${#KEYSTORE_PASSWORD}"
          if printf '%s' "$KEYSTORE_B64" | base64 -d > /dev/null 2>/tmp/b64err; then
            echo "base64 decode: OK"
          else
            echo "base64 decode: FAIL"
            cat /tmp/b64err
          fi
