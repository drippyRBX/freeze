package com.venice.freeze

import android.Manifest
import android.app.Activity
import android.app.ActivityManager
import android.content.Intent
import android.content.pm.ActivityInfo
import android.content.pm.PackageManager
import android.graphics.Color
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.provider.Settings
import android.view.View
import android.view.WindowManager
import android.widget.Button
import android.widget.LinearLayout
import android.widget.TextView
import android.widget.Toast

class MainActivity : Activity() {

    private var level = 1

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
            setShowWhenLocked(true)
            setTurnScreenOn(true)
        }
        requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT

        val root = LinearLayout(this)
        root.orientation = LinearLayout.VERTICAL
        root.setBackgroundColor(Color.parseColor("#0B0D12"))
        root.setPadding(dp(26), dp(56), dp(26), dp(32))

        root.addView(label("PRANK APP", 11f, "#7B8190"))

        val title = TextView(this)
        title.text = "Freeze"
        title.textSize = 44f
        title.setTextColor(Color.WHITE)
        title.setPadding(0, dp(8), 0, 0)
        root.addView(title)

        val body = TextView(this)
        body.text = "Covers the whole screen, blocks every tap, floods alerts, plays a siren and vibrates. Nothing breaks. Hold the pill for three seconds to get out."
        body.textSize = 14f
        body.setTextColor(Color.parseColor("#9AA0AD"))
        body.setPadding(0, dp(12), 0, 0)
        root.addView(body)

        root.addView(View(this), LinearLayout.LayoutParams(1, 0, 1f))

        root.addView(label("INTENSITY", 11f, "#6B7280"))

        val chips = LinearLayout(this)
        chips.orientation = LinearLayout.HORIZONTAL
        chips.setPadding(0, dp(8), 0, 0)
        val buttons = ArrayList<Button>()
        val names = listOf("Mild", "Annoying", "Nuclear")
        for (i in names.indices) {
            val b = Button(this)
            b.text = names[i]
            b.textSize = 13f
            b.setOnClickListener {
                level = i + 1
                for (j in buttons.indices) paint(buttons[j], j + 1)
            }
            buttons.add(b)
            val lp = LinearLayout.LayoutParams(0, dp(46), 1f)
            lp.rightMargin = dp(8)
            chips.addView(b, lp)
        }
        root.addView(chips)
        for (j in buttons.indices) paint(buttons[j], j + 1)

        val start = Button(this)
        start.text = "Start prank"
        start.textSize = 16f
        start.setTextColor(Color.WHITE)
        start.setBackgroundColor(Color.parseColor("#2563EB"))
        start.setOnClickListener { launch() }
        root.addView(start, LinearLayout.LayoutParams(
            LinearLayout.LayoutParams.MATCH_PARENT, dp(56)
        ).apply { topMargin = dp(14) })

        setContentView(root)

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
            checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
            requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
        }
    }

    private fun label(t: String, size: Float, color: String): TextView {
        val v = TextView(this)
        v.text = t
        v.textSize = size
        v.setTextColor(Color.parseColor(color))
        return v
    }

    private fun paint(b: Button, id: Int) {
        if (id == level) {
            b.setBackgroundColor(Color.parseColor("#1D3A5C"))
            b.setTextColor(Color.parseColor("#CFE4FF"))
        } else {
            b.setBackgroundColor(Color.parseColor("#15181F"))
            b.setTextColor(Color.parseColor("#9AA0AD"))
        }
    }

    private fun launch() {
        if (!Settings.canDrawOverlays(this)) {
            Toast.makeText(this, "Allow display over other apps, then tap again", Toast.LENGTH_LONG).show()
            startActivity(Intent(
                Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                Uri.parse("package:" + packageName)
            ))
            return
        }
        val i = Intent(this, PrankService::class.java)
        i.putExtra("level", level)
        startForegroundService(i)
        moveTaskToBack(true)
    }

    override fun onBackPressed() {
        val am = getSystemService(ACTIVITY_SERVICE) as ActivityManager
        val live = am.getRunningServices(60).any { s -> s.service.className == PrankService::class.java.name }
        if (live) moveTaskToBack(true) else super.onBackPressed()
    }

    private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
}
