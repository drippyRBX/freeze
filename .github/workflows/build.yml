cat > app/src/main/java/com/venice/freeze/SoundEngine.kt <<'EOF'
package com.venice.freeze

import android.media.AudioAttributes
import android.media.AudioFormat
import android.media.AudioManager
import android.media.AudioTrack
import kotlin.random.Random

class SoundEngine(private val am: AudioManager) {

    private var track: AudioTrack? = null

    fun start() {
        val rate = 44100
        val total = rate * 24
        val pcm = ShortArray(total)

        var i = 0
        while (i < total) {
            val seg = (rate * 0.22).toInt()
            val freq = Random.nextInt(480, 1560).toDouble()
            val gap = Random.nextInt(0, 7) == 0
            var n = 0
            while (n < seg && i < total) {
                var s = 0.0
                if (!gap) {
                    val phase = (i.toDouble() * freq / rate) % 1.0
                    s = if (phase < 0.5) 0.30 else -0.30
                    val gate = seg * 0.12
                    if (n < gate) s *= n / gate
                    if (n > seg - gate) s *= (seg - n) / gate
                }
                pcm[i] = (s * Short.MAX_VALUE).toInt().toShort()
                i++
                n++
            }
        }

        try {
            am.setStreamVolume(AudioManager.STREAM_MUSIC, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), 0)
        } catch (e: Exception) {}

        val t = AudioTrack.Builder()
            .setAudioAttributes(
                AudioAttributes.Builder()
                    .setUsage(AudioAttributes.USAGE_MEDIA)
                    .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                    .build()
            )
            .setAudioFormat(
                AudioFormat.Builder()
                    .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                    .setSampleRate(rate)
                    .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                    .build()
            )
            .setBufferSizeInBytes(pcm.size * 2)
            .setTransferMode(AudioTrack.MODE_STATIC)
            .build()

        t.write(pcm, 0, pcm.size)
        t.setLoopPoints(0, pcm.size, -1)
        t.play()
        track = t
    }

    fun stop() {
        try {
            track?.stop()
            track?.release()
        } catch (e: Exception) {}
        track = null
    }
}
EOF

